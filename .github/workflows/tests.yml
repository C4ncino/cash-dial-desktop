name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu-tests:
    name: Ubuntu tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Astro check
        run: pnpm check

      - name: Biome lint
        run: pnpm lint

      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Frontend tests
        run: pnpm test

      - name: Release automation tests
        run: pnpm test:release

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked -- --test-threads=1

      - name: Production build
        run: pnpm build

      - name: Integration and E2E tests
        run: |
          xvfb-run -a pnpm test:integration
          xvfb-run -a pnpm test:e2e:fast

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-ubuntu
          if-no-files-found: ignore
          retention-days: 7
          path: |
            src-tauri/test-logs
            integration-tests-front.sqlite
            e2e-test.sqlite
            ~/.local/share/**/logs

  windows-e2e:
    name: Windows E2E
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install matching Edge WebDriver
        shell: pwsh
        run: |
          $edgePath = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          $edgeVersion = (Get-Item -LiteralPath $edgePath).VersionInfo.ProductVersion
          $driverDirectory = Join-Path $env:RUNNER_TEMP "edge-driver"
          $archive = Join-Path $env:RUNNER_TEMP "edge-driver.zip"
          New-Item -ItemType Directory -Force -Path $driverDirectory | Out-Null
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$edgeVersion/edgedriver_win64.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $driverDirectory -Force
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $driverDirectory

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-windows
          if-no-files-found: ignore
          retention-days: 7
          path: |
            src-tauri/test-logs
            e2e-test.sqlite
            ~/AppData/Roaming/**/logs
