name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu-tests:
    name: Ubuntu tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
          run_install: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb

      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked -- --test-threads=1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Astro check
        run: pnpm check

      - name: Biome lint
        run: pnpm lint

      - name: Frontend tests
        run: pnpm test

      - name: Release automation tests
        run: pnpm test:release

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Integration tests
        run: |
          xvfb-run -a pnpm test:integration

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-ubuntu
          if-no-files-found: ignore
          retention-days: 7
          path: |
            src-tauri/test-logs
            integration-tests-front.sqlite
            ~/.local/share/**/logs

  windows-e2e:
    name: Windows E2E
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install matching Edge WebDriver
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"

          $nativeDriver = Join-Path $PWD "msedgedriver.exe"
          if (-not (Test-Path -LiteralPath $nativeDriver)) {
            $installedDriver = (Get-Command msedgedriver.exe -ErrorAction Stop).Source
            Copy-Item -LiteralPath $installedDriver -Destination $nativeDriver
          }

          $logDir = Join-Path $PWD "src-tauri\test-logs"
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null
          $driverLog = Join-Path $logDir "msedgedriver.log"
          $driverWrapper = Join-Path $PWD "msedgedriver-verbose.cmd"

          @'
          @echo off
          "%~dp0msedgedriver.exe" --verbose --append-log --log-path="%MSEDGEDRIVER_LOG_PATH%" %*
          '@ | Set-Content -LiteralPath $driverWrapper -Encoding ascii

          "MSEDGEDRIVER_LOG_PATH=$driverLog" >> $env:GITHUB_ENV
          "TAURI_NATIVE_DRIVER=$driverWrapper" >> $env:GITHUB_ENV
          $PWD.Path >> $env:GITHUB_PATH

          Write-Host "Microsoft Edge WebDriver: $(& $nativeDriver --version)"
          Write-Host "Verbose EdgeDriver log: $driverLog"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload EdgeDriver diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgedriver-logs-windows
          if-no-files-found: ignore
          retention-days: 7
          path: src-tauri/test-logs

      - name: Upload failed E2E database
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-database-windows
          if-no-files-found: ignore
          retention-days: 7
          path: e2e-test.sqlite

      - name: Upload failed application logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: application-logs-windows
          if-no-files-found: ignore
          retention-days: 7
          path: ~/AppData/Roaming/**/logs
